<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevJourney</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Header -->
    <header class="header">
        <div class="container">
            <h1 class="logo">DevJourney</h1>
        </div>
    </header>

    <!-- Main -->
    <main class="container">

        <!-- Greeting -->
        <section class="greeting card">

            <h2>👋 Selamat Datang, Khim</h2>

            <div class="streak">
                <span>🔥 Streak</span>
                <strong>7 Hari</strong>
            </div>

            <p class="quote">
                "One Commit is Better Than Zero Commit."
            </p>

        </section>

        <!-- Progress -->
        <section class="progress card">

            <div class="section-title">
                <h2>Progress Belajar</h2>
                <span id="progressText">75%</span>
            </div>

            <div class="progress-bar">
                <div class="progress-fill"></div>
            </div>

        </section>

        <!-- Checklist -->
        <section class="checklist card">

            <div class="section-title">
                <h2>Checklist Belajar</h2>

                <button id="addChecklistBtn">
                    + Tambah
                </button>
            </div>

            <ul id="checklistList">

                <li>

                    <label>

                        <input type="checkbox">

                        Belajar HTML

                    </label>

                    <div class="action">

                        <button>Edit</button>

                        <button>Hapus</button>

                    </div>

                </li>

                <li>

                    <label>

                        <input type="checkbox" checked>

                        Belajar CSS

                    </label>

                    <div class="action">

                        <button>Edit</button>

                        <button>Hapus</button>

                    </div>

                </li>

            </ul>

        </section>

        <!-- PKL -->
        <section class="internship card">

            <div class="section-title">

                <h2>Task PKL</h2>

                <button id="addTaskBtn">

                    + Tambah

                </button>

            </div>

            <ul id="taskList">

                <li>

                    <label>

                        <input type="checkbox">

                        Landing Page Intelix

                    </label>

                    <div class="action">

                        <button>Edit</button>

                        <button>Hapus</button>

                    </div>

                </li>

            </ul>

        </section>

        <!-- Notes -->
        <section class="notes card">

            <h2>Catatan Hari Ini</h2>

            <textarea
                id="notes"
                placeholder="Tulis apa yang dipelajari hari ini..."
            ></textarea>

        </section>

    </main>

    <!-- Footer -->
    <footer class="footer">

        <p>
            DevJourney V1 &copy; 2026
        </p>

    </footer>

    <script src="js/app.js"></script>

</body>
</html>
