<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevJourney</title>

    <!-- Remix Icon -->
    <link
    href="https://cdn.jsdelivr.net/npm/remixicon@4.6.0/fonts/remixicon.css"
    rel="stylesheet"/>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="dashboard">

    <!-- ======================
            SIDEBAR
    ======================= -->

    <aside class="sidebar">

        <div class="logo">

            <i class="ri-compass-discover-line"></i>

            <h2>DevJourney</h2>

        </div>

        <nav>

            <ul>

                <li class="active">
                    <a href="#">
                        <i class="ri-home-5-line"></i>
                        Dashboard
                    </a>
                </li>

                <li>
                    <a href="#">
                        <i class="ri-line-chart-line"></i>
                        Progress
                    </a>
                </li>

                <li>
                    <a href="#">
                        <i class="ri-checkbox-line"></i>
                        Checklist
                    </a>
                </li>

                <li>
                    <a href="#">
                        <i class="ri-briefcase-line"></i>
                        PKL Tasks
                    </a>
                </li>

                <li>
                    <a href="#">
                        <i class="ri-sticky-note-line"></i>
                        Catatan
                    </a>
                </li>

                <li>
                    <a href="#">
                        <i class="ri-bar-chart-box-line"></i>
                        Statistik
                    </a>
                </li>

                <li>
                    <a href="#">
                        <i class="ri-settings-3-line"></i>
                        Pengaturan
                    </a>
                </li>

            </ul>

        </nav>

        <div class="sidebar-footer">

            <p>

                <i class="ri-double-quotes-l"></i>

                <br>

                One Commit is Better Than Zero Commit.

            </p>

            <i class="ri-code-s-slash-line code-icon"></i>

        </div>

    </aside>


    <!-- ======================
        MAIN
    ======================= -->

    <main class="main-content">

        <header class="topbar">

            <button class="theme-btn">

                <i class="ri-moon-line"></i>

                Dark Mode

            </button>

        </header>


        <!-- Greeting -->

        <section class="card greeting-card">

        </section>


        <!-- Statistics -->

        <section class="stats">

            <div class="card"></div>

            <div class="card"></div>

            <div class="card"></div>

            <div class="card"></div>

        </section>


        <!-- Content -->

        <section class="content-grid">

            <div class="card"></div>

            <div class="card"></div>

            <div class="card"></div>

            <div class="card"></div>

        </section>

    </main>

</div>

</body>
</html>
