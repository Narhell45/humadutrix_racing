<!DOCTYPE html>
<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>To-Do List App - Easy Tutorials</title>
        <link rel="stylesheet" href="style/style.css">
    </head>
    <body>
        <div class="container">
            <div class="todo-app">
                <h2>To-Do List <img src="assets/images/icon.png"></h2>
                <!-- script.js -->
                <div class="row">
                    <input type="text" id="input-box" placeholder="Add your text">
                    <button onclick="addTask()">Add</button>
                </div>
                <div class="counter">
                    <h3 id="countTask"></h3>    
                    <h3 id="doneTask"></h3>    
                </div>
                <div class="clearTools">
                    <button class="clearAll" onclick="clearAll()"><img src=assets/images/clearAll.png alt="reseticon"/></button>
                    <button class="clearBtn" onclick="clearCompleted()">Clear CompletedTask</button>
                </div>
                <ul id="list-container">
                    
                </ul>
                <!-- script.js -->
            </div>
        </div>
        <script src="script.js"></script>
    </body>
</html>
